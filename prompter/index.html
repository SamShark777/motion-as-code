<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab 3 Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark stage. Current line huge, next line dim beneath, "say it now" tray on the right, live transcript along the bottom. */
:root{
  color-scheme: dark;
  --bg:#0e1113; --panel:#161b1e; --line:#242b2f;
  --fg:#f1efe8; --dim:#7d8783; --faint:#4b5450;
  --key:#f4cf6e; --heard:#6fc3b2; --miss:#ff9b6a; --cue:#9db4ff;
  --read:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --size:46px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--read);display:flex;flex-direction:column;padding-inline:20px;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible{outline:2px solid var(--key);outline-offset:2px}

header{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.track{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:none}
.chip.done{color:var(--heard);border-color:color-mix(in srgb,var(--heard) 40%,transparent)}
.chip.now{color:var(--bg);background:var(--key);border-color:var(--key);font-weight:700}
.chip.hasmiss::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--miss);margin-left:6px;vertical-align:middle}
.clock{font-family:var(--mono);font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
select{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:180px}
#mic{display:flex;align-items:center;gap:8px;font-weight:700}
#mic .dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}
#mic.on{border-color:var(--heard)}
#mic.on .dot{background:#ff5a5a;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,30%);gap:28px;padding-block:28px}
.stage{min-width:0;display:flex;flex-direction:column;gap:22px;overflow:auto}
.where{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.where b{color:var(--fg)}
.pips{display:flex;gap:5px}
.pip{width:22px;height:5px;border-radius:3px;background:var(--line)}
.pip.done{background:var(--heard)} .pip.miss{background:var(--miss)} .pip.now{background:var(--key)}
.now-line{font-size:var(--size);line-height:1.28;font-weight:400;text-wrap:pretty;max-width:26ch}
.kw{color:var(--key);font-weight:700;transition:color .25s}
.kw.hit{color:var(--heard);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:.18em}
.cue{display:inline-flex;align-items:center;gap:14px;font-size:calc(var(--size)*.85);font-weight:700;color:var(--cue);border:2px dashed color-mix(in srgb,var(--cue) 55%,transparent);border-radius:14px;padding:.35em .7em}
.cue small{font-size:.42em;font-weight:400;color:var(--dim);display:block}
.next{font-size:calc(var(--size)*.5);line-height:1.35;color:var(--faint);max-width:40ch}
.next::before{content:"NEXT  ";font-size:.55em;letter-spacing:.12em;color:var(--dim)}
.next .kw{color:var(--dim)}

aside{min-width:0;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);padding-left:24px;overflow:auto}
aside h2{margin:0;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--miss)}
aside .empty{color:var(--faint);font-size:16px}
.miss{background:color-mix(in srgb,var(--miss) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--miss) 35%,transparent);border-radius:10px;padding:12px 14px;text-align:left;display:block;width:100%}
.miss .from{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
.miss .say{font-size:calc(var(--size)*.46);line-height:1.3;color:var(--fg)}
.miss.cleared{opacity:0;transform:translateX(20px);transition:.5s}

footer{border-top:1px solid var(--line);padding-block:10px 14px;display:flex;flex-direction:column;gap:8px}
.heard{font-family:var(--mono);font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.heard i{color:var(--faint)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--faint)}
.bar kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim)}
.bar .sp{flex:1}
#status{color:var(--miss)}

dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(420px,90vw)}
dialog::backdrop{background:rgb(0 0 0 / .6)}
dialog h3{margin:0 0 14px}
dialog label{display:grid;gap:6px;margin-bottom:14px;font-size:14px;color:var(--dim)}
dialog input[type=number],dialog input[type=text]{font:inherit;font-size:18px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
dialog textarea{font:inherit;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
dialog hr{border:0;border-top:1px solid var(--line);margin:18px 0}
dialog .msg{flex:1;font-size:13px;color:var(--dim);align-self:center}
dialog{max-height:90vh;overflow:auto}
dialog .row{flex-wrap:wrap;margin-bottom:8px;display:flex;gap:10px;justify-content:flex-end}

.pad{display:none;gap:10px}
.pad button{flex:1;padding:16px;font-size:18px;font-weight:700}
.pad #nextBtn{background:var(--key);color:var(--bg);border-color:var(--key);flex:2}
@media (max-width:760px),(pointer:coarse){
  body{padding-inline:16px}
  header{gap:8px;padding-block:10px}
  .track{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{flex:none;font-size:12px;padding:4px 9px}
  #mic{flex:1;justify-content:center;padding:12px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:12px;padding-block:14px}
  aside{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px;max-height:32vh}
  aside:has(.empty){border-top:0;padding-top:0}
  aside .empty, aside:has(.empty) h2{display:none}
  .now-line{max-width:none}
  .bar .hint{display:none}
  .pad{display:flex}
  :root{--size:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <button id="mic" title="Start or stop listening (M)"><span class="dot"></span><span id="micLabel">Start listening</span></button>
  <select id="speaker" aria-label="Whose script"></select>
  <nav class="track" id="track"></nav>
  <span class="clock" id="clock">0:00</span>
  <button id="setupBtn">Setup</button>
</header>

<main>
  <section class="stage" id="stage" aria-live="polite"></section>
  <aside>
    <h2>Say this before moving on</h2>
    <div id="tray"></div>
  </aside>
</main>

<footer>
  <div class="pad"><button id="backBtn">Back</button><button id="nextBtn">Next</button></div>
  <div class="heard" id="heard"><span>Transcript appears here once listening starts.</span></div>
  <div class="bar">
    <span class="hint"><kbd>Space</kbd> next line</span><span class="hint"><kbd>←</kbd> back</span><span class="hint"><kbd>M</kbd> mic</span><span class="hint"><kbd>+</kbd><kbd>−</kbd> text size</span><span class="hint"><kbd>R</kbd> restart</span>
    <span class="sp"></span><span id="status"></span>
  </div>
</footer>

<dialog id="setup">
  <h3>Load a teammate's script</h3>
  <label>Name<input id="inName" type="text" placeholder="e.g. Nick"></label>
  <label>Script file (PDF, Word .docx, or .txt)<input id="inFile" type="file" accept=".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"></label>
  <label>…or paste the text<textarea id="inPaste" rows="4" placeholder="Paste script here"></textarea></label>
  <div class="row"><span id="loadMsg" class="msg"></span><button id="loadBtn">Load script</button></div>
  <div class="row" id="savedRow"></div>
  <hr>
  <h3>Settings</h3>
  <label>Matching strictness<input id="inStrict" type="range" min="0.3" max="0.7" step="0.05"></label>
  <label>Text size<input id="inSize" type="range" min="22" max="80" step="2"></label>
  <div class="row"><button id="restartBtn">Restart from top</button><button id="closeSetup">Done</button></div>
</dialog>

<script>
/* ---------- Script ----------
   {word|synonym|synonym} = a key idea. Shown as the first option, matched on any option.
   cue: a stage direction with nothing to say. alt: a fresh rephrase used if you skip the line. */
const NICK1 = [
 {name:"Title", sub:"Nicholas · slide 1", beats:[
  {say:"Good {afternoon|morning|everyone}. We are {Team 2|team two|team}: {Nicholas|nick}, {Shivam}, and {Daniel}.",
   alt:"We're Team 2: Nicholas, Shivam and Daniel."},
  {say:"Our project asks a {deceptively simple|simple|deceptively} question: when our {humanoid} classroom assistant {Yotie|yoti|yodie} {moves|move}, who is really in {control}?",
   alt:"The question behind the project: when Yotie moves, who is actually in control?"},
  {say:"We study how {instructions|instruction} become robot {actions|action}, where existing {controllers|controller} {succeed|success} or {fail|failure}, and how {physics-informed|physics} control could make them more {reliable}.",
   alt:"We look at how instructions turn into actions, where controllers break, and how physics-informed control could make them reliable."},
 ]},
 {name:"Team", sub:"Nicholas · slide 2", beats:[
  {say:"We split the work into {three|3} connected {areas|area}. I focused on the {classroom} {tasks|task} and the {control} environment.",
   alt:"Three areas of work. Mine was the classroom tasks and control environment."},
  {say:"{Shivam} investigated {Lucky Engine|lucky} behavior, {command} {interpretation|interpreting}, and {controller} {failures|failure}.",
   alt:"Shivam looked at Lucky Engine, how commands get interpreted, and why controllers fail."},
  {say:"{Daniel} worked on {motion generation|generation|motion}, {visualization|visualize}, and {quantitative|tracking} {experiments|experiment}.",
   alt:"Daniel handled motion generation, visualization and the tracking experiments."},
  {say:"Together, we're building a way to {observe}, {measure}, and eventually {improve} {G1|g one} behavior.",
   alt:"Together the goal is to observe, measure and improve how the G1 behaves."},
 ]},
 {name:"Problem", sub:"Nicholas · slide 3", beats:[
  {say:"A robot has to do more than {understand} a {sentence}.",
   alt:"Understanding the sentence is only the start."},
  {say:"It must {identify} the {task}, turn that {intent} into {coordinated} {motion}, and respond to {balance}, {contact}, and physical {constraints}.",
   alt:"It has to find the task, turn intent into coordinated motion, and deal with balance, contact and constraints."},
  {say:"A movement can look {convincing} in a {simulation|sim} {video} while still being {unreliable} as an actual task.",
   alt:"Something can look right in a sim video and still fail as a real task."},
  {say:"That {difference} is the {core} of our {research}.",
   alt:"That gap is what our research is about."},
 ]},
 {name:"Testbed", sub:"Nicholas · slide 4", beats:[
  {say:"We chose {classroom} tasks because they're easy to {describe} but physically {demanding}.",
   alt:"Classroom tasks are simple to say but hard to do physically, which is why we picked them."},
  {say:"We want {Yotie|yoti|yodie} to {approach} a {chair} and {stop}, {point} toward a {whiteboard}, and eventually {grasp|grab} and move {objects}.",
   alt:"Targets: approach a chair, point at the whiteboard, later grasp and move objects."},
  {say:"Our approach: establish a {baseline}, {identify} {failures|failure}, and make {repeatable} {tests} before claiming a {better} {controller}.",
   alt:"First a baseline, then failures, then repeatable tests, before we claim anything better."},
  {say:"{Shivam} will show what the current {baseline} has {taught|teach|learned} us.",
   alt:"Hand off to Shivam for the baseline."},
 ]},
];

const SHIVAM = [
 {name:"Observations", sub:"Shivam · slide 5", beats:[
  {say:"Thanks, {Nicholas|nick}. {Lucky Engine|lucky} gives us a {classroom} {scene} and a local {bridge} from {speech} instructions to {motion}.",
   alt:"Thanks Nicholas. Lucky Engine provides the classroom scene and a speech-to-motion bridge."},
  {say:"We tested a {two-arm|arm|arms} {motion graph|graph} for {scripted} actions.",
   alt:"We ran scripted actions through a two-arm motion graph."},
  {say:"{Graph-based|graph} {targets|target} made arm motion {freer|free} than our earlier, {stiffer|stiff} {reaching|reach}.",
   alt:"Graph targets loosened the arms compared with the stiff reaching we had before."},
  {say:"But {interacting|interaction} with the {chair} was not {repeatable}, and {balance} and {controller handoff|handoff|controller} still need {attention|work}.",
   alt:"Chair interaction wasn't repeatable, and balance and the controller handoff need work."},
  {say:"These {observations|observation} tell us what to {measure} {next}.",
   alt:"That tells us what to measure next."},
 ]},
 {name:"Obs → Outcome", sub:"Shivam · slide 6", beats:[
  {say:"To {understand} a {failure}, we need to {record} {three|3} things.",
   alt:"Understanding a failure takes three kinds of records."},
  {say:"First, the {observation|observations}: the robot {pose}, {object|objects} {locations|location}, {contacts|contact}, and {collisions|collision}.",
   alt:"Observation: pose, where objects are, contacts and collisions."},
  {say:"Second, the {action}: the {velocity|speed} or {hand target|hand|target} sent to the {controller}.",
   alt:"Action: the velocity or hand target we send the controller."},
  {say:"Third, the {episode} {outcome}: the original {instruction}, the {interpreted|interpretation} {command}, robot {state}, and whether the task {succeeded|success}.",
   alt:"Outcome: instruction, interpreted command, robot state, and success or not."},
  {say:"This helps {separate} a {language} {interpretation} error from a {control} {failure}.",
   alt:"With that we can tell a language error apart from a control failure."},
 ]},
 {name:"Demos", sub:"Shivam · slide 7", beats:[
  {say:"Here are {two|2} {examples} from the {classroom} {scene}.",
   alt:"Two examples from the classroom scene."},
  {say:"For the {chair} {instruction}, {Claude} {interpreted|interpret} it as {move-to-chair|move to|move}.",
   alt:"Chair command: Claude read it as move-to-chair."},
  {say:"The {G1|g one} {approached|approach} the chair, made {contact}, and {stumbled|stumble}.",
   alt:"The robot reached the chair, touched it, and stumbled."},
  {say:"For the {whiteboard} instruction, the robot kept its {balance}, but its {pointing|point} {arm} didn't fully {extend|extended}.",
   alt:"Whiteboard command: balanced, but the arm stopped short of full extension."},
  {cue:"Play classroom video", note:"Only if the file is available."},
  {say:"These results are {useful} because they show {partial} {execution} and specific {limits|limit}, not complete {success}.",
   alt:"The value is in seeing partial execution and exactly where the limits are."},
 ]},
 {name:"Goes wrong", sub:"Shivam · slide 8", beats:[
  {say:"We also {observed|observe|saw} a {controller handoff|handoff} {problem}.",
   alt:"Next, the controller handoff issue."},
  {say:"After an {arm} motion played, the arm {controller} {retained|kept|keeps} {control}, so a later {command} couldn't {move} normally.",
   alt:"The arm controller held on after its motion, so the next command couldn't move the robot properly."},
  {cue:"Play controller failure video"},
  {say:"So we need an {explicit} {transition}: return to a {safe pose|safe|pose}, {release} the previous controller, and {restore} {walker|walking} control.",
   alt:"The fix is a clear transition: safe pose, release the arm controller, give control back to the walker."},
  {say:"We haven't yet {demonstrated|demonstrate} chair {transport}, or implemented {grasping|grasp} and {manipulation}.",
   alt:"Chair transport, grasping and manipulation are still future work."},
 ]},
 {name:"Evaluation", sub:"Shivam · slide 9", beats:[
  {say:"This slide {proposes|propose} how to {evaluate} {ten|10} {commands}, including {specific} and {vague} instructions.",
   alt:"Here's the plan for scoring ten commands, both specific and vague."},
  {say:"We'd {score} whether the {JSON|jason} is {valid}, whether the {action}, {object}, and {target} are {correct}, and whether the {simulation|sim} {succeeds|success}.",
   alt:"Checks: valid JSON, correct action, object and target, and success in simulation."},
  {say:"The numbers shown are {illustrative|example} {sample} scores, not results from ten {measured|measure} {trials}.",
   alt:"Important: these are sample numbers, not measured trial results."},
  {say:"The next {experiment} is to {replace} these {example|sample} values with actual {episode} {logs|log}, so we can {quantify} which {stage} fails.",
   alt:"Next we fill this with real episode logs to pin down which stage fails."},
  {say:"That's how we'll {measure} the {command} side. {Daniel} will show how we measure the {motion} itself.",
   alt:"Hand off to Daniel for motion measurement."},
 ]},
];

const DANIEL = [
 {name:"Motion demo", sub:"Daniel · slide 10", beats:[
  {say:"Thanks, {Shivam}. My work focused on what happens between a {motion} {reference} and a robot actually {following|follow} it.",
   alt:"Thanks Shivam. My focus is the gap between a motion reference and the robot following it."},
  {say:"First, I used motion {visualization|visualize} to {inspect} the {G1|g one}'s {walking|walk} and {whole-body|whole body} movement: {gait}, {posture}, and {timing}.",
   alt:"I visualized the walking and full-body motion to check gait, posture and timing."},
  {cue:"Play walking motion video"},
  {say:"A {video} is a useful first {check}, but it doesn't tell us how closely the {joints|joint} {followed|follow} their {targets|target}.",
   alt:"Video alone can't show how well the joints tracked their targets."},
  {say:"So our next step is to {save} {reference} {trajectories|trajectory} and {compare} them against {measured} joint {positions|position}.",
   alt:"Next we save reference trajectories and compare them with measured joint positions."},
 ]},
 {name:"Elbow", sub:"Daniel · slide 11", beats:[
  {say:"This slide shows a {separate} {G1|g one} {right-elbow|elbow} {simulation} {experiment}.",
   alt:"This is a standalone right-elbow simulation test."},
  {say:"The {blue} curve is the {commanded|command} angle, and the {orange} curve is the {actual} {response}.",
   alt:"Blue is commanded, orange is the actual response."},
  {say:"Ideally they'd {overlap}. Instead, the response {lags|lag} behind, especially during {changes|change} in {direction}.",
   alt:"They should overlap, but the response trails, mostly when direction changes."},
  {say:"The {error} {graph} {measures|measure} that {difference} over time.",
   alt:"The error plot tracks that gap over time."},
  {say:"Across {350} {samples} and {6.98|7|seven} {seconds}, the {root-mean-square|rms|root mean square} {tracking} error was {1.20|1.2|one point two} {degrees|degree}.",
   alt:"Over 350 samples and about 7 seconds, RMS tracking error was 1.2 degrees."},
  {say:"The {maximum|max} error was {2.37|2.4} {degrees|degree}.",
   alt:"Peak error was 2.37 degrees."},
  {say:"These are {measured} {results} from the {elbow} {test}, not from the {walking|walk} {video}.",
   alt:"These numbers come from the elbow test, not the walking video."},
  {say:"This gives us a {concrete} {baseline} for future {control} {comparisons|comparison}.",
   alt:"It's a concrete baseline for comparing controllers later."},
  {say:"{Nicholas|nick} will {wrap up|wrap|summarize} where this leaves us.",
   alt:"Hand back to Nicholas for the conclusion."},
 ]},
];

const NICK2 = [
 {name:"Conclusion", sub:"Nicholas · slide 12", beats:[
  {say:"Thanks, {Daniel}. To {summarize}: we can {trigger} and {observe} {classroom} {actions|action}, and we can {visualize} motion {references|reference}.",
   alt:"Thanks Daniel. In short: we can trigger and observe classroom actions and visualize motion references."},
  {say:"But {chair} {contact}, {controller handoff|handoff}, and {repeatable} {multi-joint|joint} {tracking} still need {improvement|improve}.",
   alt:"Still to fix: chair contact, controller handoff, and repeatable multi-joint tracking."},
  {say:"Next, we'll {collect} {real} {command}, {state}, and {outcome} {logs|log}, and run {controlled} {comparisons|comparison}.",
   alt:"Next up: real logs of command, state and outcome, and controlled comparisons."},
  {say:"We'll also study how {dynamics} and {feedback} {constraints} affect {performance}.",
   alt:"We'll also look at how dynamics and feedback constraints change performance."},
  {say:"Our {goal} isn't just a robot that {moves|move}, but one whose behavior we can {explain}, {measure}, and {improve}.",
   alt:"The aim is a robot we can explain, measure and improve, not just one that moves."},
  {say:"{Thank you|thanks}. We {welcome} your {questions|question}.",
   alt:"Thank you, we'd love your questions."},
 ]},
];

const BUILTIN = [
 {name:"Shivam", secs:SHIVAM},
 {name:"Nicholas", secs:[...NICK1, ...NICK2]},
 {name:"Daniel", secs:DANIEL},
 {name:"Whole team", secs:[...NICK1, ...SHIVAM, ...DANIEL, ...NICK2]},
];
const SCRIPT = SHIVAM;


/* ---------- Parsing & matching ---------- */
const NUM = {zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10"};
function tokenize(s){
  return s.toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9_]+/g," ").split(/[\s_]+/).filter(Boolean).map(w=>NUM[w]||w);
}
function tokMatch(a,b){
  if(a===b) return true;
  const m=Math.min(a.length,b.length); if(m<4) return false;
  let p=0; while(p<m && a[p]===b[p]) p++;
  return p>=Math.max(4,m-2);
}

let X="", Y="", strict=0.45;
let ACTIVE=SCRIPT, beats=[];
function build(script){
  ACTIVE=script; beats=[];
  script.forEach((sec,si)=>sec.beats.forEach(b=>{
    const groups=[];
    if(!b.cue){ const re=/\{([^}]+)\}/g; let m; while((m=re.exec(b.say))) groups.push(m[1].split("|").map(tokenize)); }
    beats.push({...b,si,groups});
  }));
}
build(SCRIPT);

/* ---------- Turning an uploaded script into prompter lines ---------- */
const STOP=new Set("a an the and or but so if then than that this these those there here is are was were be been being am i im me my we our us you your he she it its they them their to of in on at for from with by as into onto about over under after before again just also very really can could will would should do did does done have has had not no yes what which who when where why how all any each every some more most other such only own same too now well like get got go going one two three".split(" "));
function makeBeat(text){
  text=text.replace(/[{}]/g,"").trim();
  const words=text.match(/[A-Za-z0-9_']+/g)||[];
  const seen=new Set(), cand=[];
  words.forEach((w,i)=>{ const l=w.toLowerCase().replace(/'s$/,""); if(STOP.has(l)||(l.length<4&&!/\d/.test(l))||seen.has(l)) return; seen.add(l);
    cand.push({w,i,score:l.length+(/^[A-Z]/.test(w)&&i>0?3:0)+(/\d/.test(l)?3:0)}); });
  const k=Math.max(1,Math.min(4,Math.round(words.length/5)));
  const pick=cand.sort((a,b)=>b.score-a.score).slice(0,k).sort((a,b)=>a.i-b.i);
  let say=text;
  for(const c of pick){ say=say.replace(new RegExp("\\b"+c.w.replace(/[^A-Za-z0-9_']/g,"")+"\\b"),"{"+c.w+"}"); }
  return {say, alt:"Cover this: "+pick.map(c=>c.w).join(" · ")};
}
function parseText(raw){
  const lines=raw.replace(/\r/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const secs=[]; let sec=null;
  const isHead=l=> l.length<=60 && (/^(#+|\d+[.)])\s+\S/.test(l) || (!/[.?!:;,"”)\]]$/.test(l) && l.split(/\s+/).length<=7));
  for(const l of lines){
    if(isHead(l)){ sec={name:l.replace(/^(#+|\d+[.)])\s*/,"").replace(/[*_]/g,"").slice(0,30),sub:"",beats:[]}; secs.push(sec); continue; }
    if(!sec){ sec={name:"Start",sub:"",beats:[]}; secs.push(sec); }
    for(const part of l.split(/(\[[^\]]+\])/)){
      if(/^\[.*\]$/.test(part)){ sec.beats.push({cue:part.slice(1,-1)}); continue; }
      const sents=part.replace(/[*"“”]/g,"").replace(/(?<!\w)_+|_+(?!\w)/g,"").match(/[^.!?]+[.!?]*/g)||[];
      let buf="";
      for(const raw2 of sents){ const t=raw2.trim(); if(!t) continue;
        if(buf && (buf+" "+t).split(/\s+/).length>28){ sec.beats.push(makeBeat(buf)); buf=t; } else buf=buf?buf+" "+t:t;
        if(buf.split(/\s+/).length>=14){ sec.beats.push(makeBeat(buf)); buf=""; } }
      if(buf) sec.beats.push(makeBeat(buf));
    }
  }
  let out=secs.filter(x=>x.beats.some(b=>!b.cue));
  if(out.length===1 && out[0].beats.length>8){
    const all=out[0].beats; out=[];
    for(let i=0;i<all.length;i+=5) out.push({name:"Part "+(out.length+1),sub:"",beats:all.slice(i,i+5)});
  }
  return out;
}
function joinPdfLines(lines){
  const out=[];
  for(const raw of lines){ const l=raw.trim(); if(!l){ out.push(""); continue; }
    const prev=out[out.length-1];
    if(prev && !/[.?!:"”]$/.test(prev) && /^[a-z(,]/.test(l)) out[out.length-1]=prev+" "+l; else out.push(l); }
  return out.join("\n");
}
function loadLib(src){ return new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=()=>rej(new Error("Could not load the file reader. Check your connection.")); document.head.appendChild(el); }); }
async function fileToText(f){
  const n=f.name.toLowerCase();
  if(n.endsWith(".pdf")){
    if(!window.pdfjsLib){ await loadLib("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; const lines=[];
    for(let i=1;i<=pdf.numPages;i++){
      const c=await (await pdf.getPage(i)).getTextContent(); let line="", lastY=null;
      for(const it of c.items){ const y=it.transform[5]; if(lastY!==null && Math.abs(y-lastY)>2){ lines.push(line); line=""; } line+=it.str; lastY=y; if(it.hasEOL){ lines.push(line); line=""; lastY=null; } }
      lines.push(line); lines.push("");
    }
    return joinPdfLines(lines);
  }
  if(n.endsWith(".docx")){
    if(!window.mammoth) await loadLib("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value;
  }
  if(n.endsWith(".doc")) throw new Error("Old .doc files can't be read. Save it as .docx or PDF, or paste the text.");
  return await f.text();
}
let saved=[];
try{ saved=JSON.parse(localStorage.getItem("lab3scripts")||"[]"); }catch(_){}
function persistScripts(){ try{ localStorage.setItem("lab3scripts",JSON.stringify(saved)); }catch(_){} }
function fillSpeakers(sel){
  $("speaker").innerHTML=BUILTIN.map((x,i)=>`<option value="b${i}">${esc(x.name)}</option>`).join("")+(saved.length?`<optgroup label="Uploaded">`+saved.map((x,i)=>`<option value="u${i}">${esc(x.name)} (uploaded)</option>`).join("")+`</optgroup>`:"");
  $("speaker").value=sel;
}
function useScript(key){
  const i=+key.slice(1);
  build(key[0]==="b"?BUILTIN[i].secs:saved[i].secs); restart();
  try{ localStorage.setItem("lab3speaker",key); }catch(_){}
}

function hits(i,toks){ return beats[i].groups.map(g=>g.some(alt=>alt.length && alt.every(t=>toks.some(w=>tokMatch(t,w))))); }
function need(i,isAhead){
  const n=beats[i].groups.length; if(!n) return Infinity;
  if(isAhead) return Math.min(n,Math.max(2,Math.ceil(n*(strict+0.15))));
  return n<=2?1:Math.ceil(n*strict);
}
function covered(i,toks,isAhead){ return hits(i,toks).filter(Boolean).length>=need(i,isAhead); }

/* ---------- State ---------- */
let cur=0, status=beats.map(()=> "todo"), missFrom={}, words=[], interim=[], winStart=0, lastHits={};
function heard(from){ return words.slice(Math.max(0,from)).concat(interim); }
function advanceTo(j){ cur=Math.min(j,beats.length); winStart=words.length+interim.length; }
function nextSpoken(i){ let j=i; while(j<beats.length && beats[j].cue) j++; return j; }

function evaluate(){
  if(cur>=beats.length) return checkMissed();
  const toks=heard(winStart-6);
  lastHits={};
  for(let k=cur;k<Math.min(beats.length,cur+4);k++) if(!beats[k].cue) lastHits[k]=hits(k,toks);
  const b=beats[cur];
  if(b.cue){
    const n=nextSpoken(cur);
    if(n<beats.length && covered(n,toks,false)){ for(let k=cur;k<=n;k++) status[k]="done"; advanceTo(n+1); }
  } else if(covered(cur,toks,false)){
    status[cur]="done"; advanceTo(cur+1);
  } else {
    for(let k=cur+1;k<Math.min(beats.length,cur+4);k++){
      if(beats[k].cue) continue;
      if(covered(k,toks,true)){
        for(let s=cur;s<k;s++){ if(beats[s].cue) status[s]="done"; else { status[s]="missed"; missFrom[s]=winStart-6; } }
        status[k]="done"; advanceTo(k+1); break;
      }
    }
  }
  checkMissed();
}
function checkMissed(){
  for(const i of Object.keys(missFrom)){
    if(covered(+i,heard(missFrom[i]),false)){ status[i]="done"; delete missFrom[i]; flashCleared(+i); }
  }
}

/* ---------- Rendering ---------- */
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fill(s){ return s.replace(/%X%/g, X||"[X]").replace(/%Y%/g, Y||"[Y]"); }
function sayHTML(i,withHits){
  const b=beats[i]; let g=0; const h=withHits?(lastHits[i]||[]):[];
  return esc(fill(b.say)).replace(/\{([^}]+)\}/g,(_,inner)=>{ const hit=h[g++]; return `<span class="kw${hit?" hit":""}">${inner.split("|")[0]}</span>`; });
}
function cueHTML(b){ return `<div class="cue">▶ ${esc(b.cue)}${b.note?`<small>${esc(b.note)}</small>`:""}</div>`; }

function render(){
  const stage=$("stage");
  if(cur>=beats.length){
    stage.innerHTML=`<div class="where"><b>Done</b></div><div class="now-line">You've reached the end. ${Object.keys(missFrom).length?'Anything still listed on the right was not covered.':'Every point was covered.'}</div>`;
  } else {
    const b=beats[cur], sec=ACTIVE[b.si];
    const secBeats=beats.map((x,i)=>i).filter(i=>beats[i].si===b.si);
    const pips=secBeats.map(i=>`<span class="pip ${i===cur?"now":status[i]==="done"?"done":status[i]==="missed"?"miss":""}"></span>`).join("");
    let html=`<div class="where"><b>${String(b.si+1).padStart(2,"0")} ${esc(sec.name)}</b><span>${esc(sec.sub)}</span><span class="pips">${pips}</span></div>`;
    html+= b.cue ? cueHTML(b) : `<div class="now-line">${sayHTML(cur,true)}</div>`;
    if(!b.cue && b.note) html+=`<div class="where" style="color:var(--cue);text-transform:none;letter-spacing:0;font-size:18px">${esc(b.note)}</div>`;
    const n=cur+1;
    if(n<beats.length) html+= beats[n].cue ? `<div class="next">${esc(beats[n].cue)}</div>` : `<div class="next">${sayHTML(n,false)}</div>`;
    stage.innerHTML=html;
  }
  // track
  $("track").innerHTML=ACTIVE.map((s,si)=>{
    const idx=beats.map((x,i)=>i).filter(i=>beats[i].si===si);
    const isNow=cur<beats.length&&beats[cur].si===si;
    const allDone=idx.every(i=>status[i]!=="todo");
    const miss=idx.some(i=>status[i]==="missed");
    return `<button class="chip ${isNow?"now":allDone?"done":""} ${miss?"hasmiss":""}" data-sec="${si}">${esc(s.name)}</button>`;
  }).join("");
  // tray
  const missed=Object.keys(missFrom).map(Number).sort((a,b)=>a-b);
  $("tray").innerHTML = missed.length ? missed.map(i=>`<button class="miss" data-miss="${i}" title="Tap to dismiss"><span class="from">${esc(ACTIVE[beats[i].si].name)}</span><span class="say">${esc(fill(beats[i].alt))}</span></button>`).join("")
    : `<p class="empty">Nothing skipped so far.</p>`;
  // transcript
  const tail=words.slice(-24).join(" "), it=interim.join(" ");
  if(tail||it) $("heard").innerHTML=`<span>${esc(tail)} <i>${esc(it)}</i></span>`;
}
function flashCleared(i){ const el=document.querySelector(`[data-miss="${i}"]`); if(el) el.classList.add("cleared"); }

/* ---------- Speech ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false, t0=null, wake=null;
function setStatus(s){ $("status").textContent=s; }
function startMic(){
  if(!SR){ setStatus("Voice tracking is not supported here. On iPhone use Safari; Next still works."); return; }
  rec=new SR(); rec.continuous=true; rec.interimResults=true; rec.lang="en-US";
  rec.onresult=e=>{
    let tmp="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) words.push(...tokenize(r[0].transcript)); else tmp+=r[0].transcript+" ";
    }
    interim=tokenize(tmp);
    evaluate(); render();
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ listening=false; setStatus("Microphone blocked. On iPhone: Settings > Safari > Microphone > Allow, then tap Start."); updMic(); }
    else if(e.error==="network"){ setStatus("Speech service unreachable. Check Wi-Fi; Space still advances."); }
  };
  rec.onend=()=>{ if(listening) setTimeout(()=>{ try{rec.start()}catch(_){} },120); };
  try{ rec.start(); listening=true; setStatus(""); if(!t0) t0=Date.now(); }catch(_){}
  try{ navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{}); }catch(_){}
  updMic();
}
function stopMic(){ listening=false; try{rec&&rec.stop()}catch(_){} interim=[]; updMic(); render(); }
function updMic(){ $("mic").classList.toggle("on",listening); $("micLabel").textContent=listening?"Listening":"Start listening"; }
$("mic").onclick=()=> listening?stopMic():startMic();

setInterval(()=>{ if(!t0) return; const s=Math.floor((Date.now()-t0)/1000); $("clock").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} `; },500);

/* ---------- Controls ---------- */
function manualNext(){
  if(cur>=beats.length) return;
  const b=beats[cur];
  if(b.cue || (lastHits[cur]||[]).some(Boolean)) status[cur]="done";
  else { status[cur]="missed"; missFrom[cur]=words.length; }
  advanceTo(cur+1); render();
}
function back(){ if(cur===0) return; cur--; status[cur]="todo"; delete missFrom[cur]; winStart=words.length; lastHits={}; render(); }
function jumpSection(si){ const i=beats.findIndex(b=>b.si===si); for(let k=i;k<beats.length;k++){ status[k]="todo"; delete missFrom[k]; } cur=i; winStart=words.length; lastHits={}; render(); }
function restart(){ cur=0; status=beats.map(()=>"todo"); missFrom={}; words=[]; interim=[]; winStart=0; lastHits={}; t0=listening?Date.now():null; $("clock").textContent="0:00"; $("heard").innerHTML="<span>Transcript cleared.</span>"; render(); }
function size(d){ const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size"))+d; const c=Math.max(22,Math.min(90,v)); document.documentElement.style.setProperty("--size",c+"px"); save(); }

$("track").onclick=e=>{ const c=e.target.closest("[data-sec]"); if(c) jumpSection(+c.dataset.sec); };
$("tray").onclick=e=>{ const m=e.target.closest("[data-miss]"); if(m){ const i=+m.dataset.miss; status[i]="done"; delete missFrom[i]; render(); } };
document.addEventListener("keydown",e=>{
  if($("setup").open || e.target.tagName==="INPUT") return;
  if(e.key===" "||e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); manualNext(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); back(); }
  else if(e.key==="m"||e.key==="M"){ listening?stopMic():startMic(); }
  else if(e.key==="+"||e.key==="="){ size(4); }
  else if(e.key==="-"||e.key==="_"){ size(-4); }
  else if(e.key==="r"||e.key==="R"){ restart(); }
});

/* ---------- Setup & saved prefs ---------- */
function save(){ try{ localStorage.setItem("lab3prompter",JSON.stringify({X,Y,strict,size:getComputedStyle(document.documentElement).getPropertyValue("--size").trim()})); }catch(_){} }
try{ const p=JSON.parse(localStorage.getItem("lab3prompter")||"{}"); X=p.X||""; Y=p.Y||""; if(p.strict) strict=+p.strict; if(p.size) document.documentElement.style.setProperty("--size",p.size); }catch(_){}
$("setupBtn").onclick=()=>{ $("inSize").value=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size")); $("inStrict").value=strict; $("setup").showModal(); };
$("closeSetup").onclick=()=>{ strict=+$("inStrict").value; save(); $("setup").close(); render(); };

$("inSize").oninput=e=>{ document.documentElement.style.setProperty("--size",e.target.value+"px"); save(); };
$("restartBtn").onclick=()=>{ restart(); $("setup").close(); };
$("speaker").onchange=e=>useScript(e.target.value);
function renderSaved(){ $("savedRow").innerHTML = saved.length ? saved.map((x,i)=>`<button data-del="${i}" title="Remove">Remove ${esc(x.name)}</button>`).join("") : ""; }
$("savedRow").onclick=e=>{ const b=e.target.closest("[data-del]"); if(!b) return; const i=+b.dataset.del; const cur=$("speaker").value; saved.splice(i,1); persistScripts(); renderSaved();
  if(cur==="u"+i){ fillSpeakers("b0"); useScript("b0"); } else if(cur[0]==="u" && +cur.slice(1)>i){ fillSpeakers("u"+(+cur.slice(1)-1)); } else fillSpeakers(cur); };
$("loadBtn").onclick=async()=>{
  const name=$("inName").value.trim()||"Teammate", f=$("inFile").files[0], pasted=$("inPaste").value.trim();
  if(!f && !pasted){ $("loadMsg").textContent="Choose a file or paste the script first."; return; }
  $("loadMsg").textContent="Reading…";
  try{
    const text=f? await fileToText(f) : pasted;
    const secs=parseText(text);
    const n=secs.reduce((a,x)=>a+x.beats.filter(b=>!b.cue).length,0);
    if(!n){ $("loadMsg").textContent="No readable text found. A scanned PDF won't work; try the .docx or paste it."; return; }
    const at=saved.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
    if(at>=0) saved[at]={name,secs}; else saved.push({name,secs});
    persistScripts(); const idx=at>=0?at:saved.length-1;
    fillSpeakers("u"+idx); useScript("u"+idx); renderSaved();
    $("loadMsg").textContent=`Loaded ${n} lines in ${secs.length} sections.`;
    $("inFile").value=""; $("inPaste").value="";
  }catch(err){ $("loadMsg").textContent=err.message||"Couldn't read that file."; }
};
let startKey="b0"; try{ startKey=localStorage.getItem("lab3speaker")||"b0"; }catch(_){}
if(!(startKey[0]==="b"&&BUILTIN[+startKey.slice(1)]) && !(startKey[0]==="u"&&saved[+startKey.slice(1)])) startKey="b0";
fillSpeakers(startKey); renderSaved(); useScript(startKey);
$("nextBtn").onclick=manualNext; $("backBtn").onclick=back;
render();
</script>
</body>
</html>
