<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lab 3 Prompter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark stage. Current line huge, next line dim beneath, "say it now" tray on the right, live transcript along the bottom. */
:root{
  color-scheme: dark;
  --bg:#0e1113; --panel:#161b1e; --line:#242b2f;
  --fg:#f1efe8; --dim:#7d8783; --faint:#4b5450;
  --key:#ffd04f; --unsaid:#b9bfb8; --heard:#6fc3b2; --miss:#ff9b6a; --cue:#9db4ff;
  --read:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --size:46px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--read);display:flex;flex-direction:column;padding-inline:20px;overflow:hidden}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--dim)}
button:focus-visible,input:focus-visible{outline:2px solid var(--key);outline-offset:2px}

header{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.track{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);background:none}
.chip.done{color:var(--heard);border-color:color-mix(in srgb,var(--heard) 40%,transparent)}
.chip.now{color:var(--bg);background:var(--key);border-color:var(--key);font-weight:700}
.chip.hasmiss::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--miss);margin-left:6px;vertical-align:middle}
.clock{font-family:var(--mono);font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
select{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:180px}
#mic{display:flex;align-items:center;gap:8px;font-weight:700}
#mic .dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}
#mic.on{border-color:var(--heard)}
#mic.on .dot{background:#ff5a5a;animation:pulse 1.4s infinite}
#mic.weak{border-color:var(--miss)} #mic.weak .dot{background:var(--miss)}
@keyframes pulse{50%{opacity:.35}}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,30%);gap:28px;padding-block:28px}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.lyrics{position:relative;flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 78%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 78%,transparent 100%)}
.lyr{position:relative;transition:transform .55s cubic-bezier(.2,.7,.2,1);will-change:transform}
.line{font-size:var(--size);line-height:1.25;margin:0 0 .5em;max-width:28ch;text-wrap:pretty;transition:opacity .45s ease,transform .45s ease;transform-origin:left center}
.line.past,.line.future{transform:scale(.95)}
.line.missed{box-shadow:inset 4px 0 0 var(--miss);padding-left:.35em}
.line.donefill .w{color:var(--key)}
.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:1.4em 0 .5em;transition:opacity .45s}
.line.end{color:var(--dim);font-size:calc(var(--size)*.6)}
.where{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.where b{color:var(--fg)}
.pips{display:flex;gap:5px}
.pip{width:22px;height:5px;border-radius:3px;background:var(--line)}
.pip.done{background:var(--heard)} .pip.pmiss{background:var(--miss)} .pip.now{background:var(--key)}
.now-line{font-size:var(--size);line-height:1.28;font-weight:400;text-wrap:pretty;max-width:26ch}
.w{color:var(--unsaid);transition:color .18s ease,background-color .18s ease;border-radius:.18em;padding:0 .04em;margin:0 -.04em}
.w.said{color:var(--key)}
.w.cur{color:var(--fg);background:color-mix(in srgb,var(--key) 22%,transparent);box-shadow:0 .08em 0 var(--key)}
.prev{font-size:calc(var(--size)*.42);line-height:1.35;color:color-mix(in srgb,var(--key) 55%,var(--bg));max-width:44ch}
.cue{display:inline-flex;align-items:center;gap:14px;font-size:calc(var(--size)*.85);font-weight:700;color:var(--cue);border:2px dashed color-mix(in srgb,var(--cue) 55%,transparent);border-radius:14px;padding:.35em .7em}
.cue small{font-size:.42em;font-weight:400;color:var(--dim);display:block}
.next{font-size:calc(var(--size)*.5);line-height:1.35;color:var(--faint);max-width:40ch}
.next::before{content:"NEXT  ";font-size:.55em;letter-spacing:.12em;color:var(--dim)}


aside{min-width:0;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);padding-left:24px;overflow:auto}
.trayhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
#trayClose{font-size:22px;line-height:1;padding:4px 12px}
#trayOpen{color:var(--miss);border-color:color-mix(in srgb,var(--miss) 45%,transparent)}
body.notray main{grid-template-columns:minmax(0,1fr)}
body.notray aside{display:none}
aside h2{margin:0;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--miss)}
aside .empty{color:var(--faint);font-size:16px}
.miss{background:color-mix(in srgb,var(--miss) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--miss) 35%,transparent);border-radius:10px;padding:12px 14px;text-align:left;display:block;width:100%}
.miss .from{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:4px}
.miss .say{font-size:calc(var(--size)*.46);line-height:1.3;color:var(--fg)}
.miss.cleared{opacity:0;transform:translateX(20px);transition:.5s}

footer{border-top:1px solid var(--line);padding-block:10px 14px;display:flex;flex-direction:column;gap:8px}
.heard{font-family:var(--mono);font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
.heard i{color:var(--faint)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--faint)}
.bar kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim)}
.bar .sp{flex:1}
#status{color:var(--miss)}

dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(420px,90vw)}
dialog::backdrop{background:rgb(0 0 0 / .6)}
dialog h3{margin:0 0 14px}
dialog label{display:grid;gap:6px;margin-bottom:14px;font-size:14px;color:var(--dim)}
dialog input[type=number],dialog input[type=text]{font:inherit;font-size:18px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
dialog textarea{font:inherit;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
dialog label.check{display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
dialog label.check input{margin-top:3px;width:18px;height:18px}
dialog hr{border:0;border-top:1px solid var(--line);margin:18px 0}
dialog .msg{flex:1;font-size:13px;color:var(--dim);align-self:center}
dialog{max-height:90vh;overflow:auto}
dialog .row{flex-wrap:wrap;margin-bottom:8px;display:flex;gap:10px;justify-content:flex-end}

.pad{display:none;gap:10px}
.pad button{flex:1;padding:16px;font-size:18px;font-weight:700}
.pad #nextBtn{background:var(--key);color:var(--bg);border-color:var(--key);flex:2}
@media (max-width:760px),(pointer:coarse){
  body{padding-inline:16px}
  header{gap:8px;padding-block:10px}
  .track{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .chip{flex:none;font-size:12px;padding:4px 9px}
  #mic{flex:1 1 auto;justify-content:center;padding:10px 12px}
  select{max-width:120px}
  #setupBtn{padding:10px 12px}
  .clock{font-size:13px}
  .where{display:none}
  aside{max-height:20vh}
  .miss{padding:8px 12px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:12px;padding-block:14px}
  aside{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px}
  aside:has(.empty){border-top:0;padding-top:0}
  aside .empty, aside:has(.empty) .trayhead{display:none}
  .line{max-width:none}
  .bar .hint{display:none}
  .pad{display:flex}
  :root{--size:28px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <button id="mic" title="Start or stop listening (M)"><span class="dot"></span><span id="micLabel">Start listening</span></button>
  <select id="speaker" aria-label="Whose script"></select>
  <nav class="track" id="track"></nav>
  <span class="clock" id="clock">0:00</span>
  <button id="trayOpen" hidden>Skipped</button>
  <button id="setupBtn">Settings</button>
</header>

<main>
  <section class="stage" id="stage"><div class="where" id="where"></div><div class="lyrics" id="lyrv"><div class="lyr" id="lyr"></div></div></section>
  <aside>
    <div class="trayhead"><h2>You skipped these</h2><button id="trayClose" aria-label="Close skipped list">×</button></div>
    <div id="tray"></div>
  </aside>
</main>

<footer>
  <div class="pad"><button id="backBtn">Back</button><button id="nextBtn">Next</button></div>
  <div class="heard" id="heard"><span>Transcript appears here once listening starts.</span></div>
  <div class="bar">
    <span class="hint"><kbd>Space</kbd> next line</span><span class="hint"><kbd>←</kbd> back</span><span class="hint"><kbd>M</kbd> mic</span><span class="hint"><kbd>+</kbd><kbd>−</kbd> text size</span><span class="hint"><kbd>R</kbd> restart</span>
    <span class="sp"></span><span id="status"></span>
  </div>
</footer>

<dialog id="setup">
  <h3>Load a teammate's script</h3>
  <label>Name<input id="inName" type="text" placeholder="e.g. Nick"></label>
  <label>Script file (PDF, Word .docx, or .txt)<input id="inFile" type="file" accept=".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain"></label>
  <label>…or paste the text<textarea id="inPaste" rows="4" placeholder="Paste script here"></textarea></label>
  <div class="row"><span id="loadMsg" class="msg"></span><button id="loadBtn">Load script</button></div>
  <div class="row" id="savedRow"></div>
  <hr>
  <h3>Settings</h3>
  <label>Matching strictness<input id="inStrict" type="range" min="0.3" max="0.7" step="0.05"></label>
  <label class="check"><input id="inOffline" type="checkbox"> Offline speech (Chrome or Edge on a laptop only). Downloads a speech model once, then works without Wi-Fi.</label>
  <label>Text size<input id="inSize" type="range" min="22" max="80" step="2"></label>
  <div class="row"><button id="restartBtn">Restart from top</button><button id="closeSetup">Done</button></div>
</dialog>

<script>
/* ================= Scripts (exact wording) ================= */
const SHIVAM = [
 {name:"Lucky Engine", sub:"Slide 5 · What Lucky Engine has taught us", items:[
  {say:"Hi, I'm Shivam, the Data and Policy Researcher for Team 2.", alt:"Introduce yourself: Shivam, Data and Policy, Team 2."},
  {say:"Basically, I'm the person who keeps the robot's receipts.", alt:"Your role in one line: you keep the robot's records."},
  {say:"Our question was simple: can we turn a classroom instruction into something G1 actually does?", alt:"The question: can a classroom instruction become a real G1 action?"},
  {say:"We have a classroom environment in Lucky Engine, walking commands, and a motion graph that gives us more freedom with both arms.", alt:"What exists: the Lucky Engine classroom, walking commands, the two-arm motion graph."},
  {say:"That took some experimenting.", alt:"It took trial and error to get there."},
  {say:"Earlier, the arms looked like a mannequin trying to wave.", alt:"Early on the arm motion was stiff."},
  {say:"The motion graph made them move more freely, but moving freely and completing a useful task are different things.", alt:"Freer arms helped, but free motion isn't the same as finishing a task."},
  {say:"Walking toward a chair, pointing at something, and keeping balance all gave us different challenges.", alt:"Chair approach, pointing and balance each had their own problems."},
  {say:"That's what simulation has taught us: a movement can look promising and still need a lot of testing.", alt:"Lesson from simulation: looking promising still needs heavy testing."},
 ]},
 {name:"Policy record", sub:"Slide 6 · What should a policy record?", items:[
  {say:"When something goes wrong, we need to understand where it went wrong.", alt:"Failures only help if we can locate where they happened."},
  {say:"Did the system misunderstand the instruction, or did the robot struggle to carry it out?", alt:"Was it a misunderstanding, or a robot execution problem?"},
  {say:"My role is to define what information we should collect to answer that.", alt:"Your job: decide what data answers that question."},
  {say:"First, the starting situation: where the robot is, where the object is, and whether anything is in its way.", alt:"One: starting state, robot position, object position, obstacles."},
  {say:"Second, the action we sent: for example, a walking command or an arm target.", alt:"Two: the action sent, like a walk command or arm target."},
  {say:"Third, the outcome: did it reach the object, make contact, or lose balance?", alt:"Three: the outcome, reached, contact, or lost balance."},
  {say:"Together, those make one test episode.", alt:"Those three form one episode."},
  {say:"We haven't collected every measurement yet, but this gives us a consistent way to organize future tests and data for policy training.", alt:"Not all measured yet, but it's the structure for future tests and policy training data."},
 ]},
 {name:"Command → motion", sub:"How a classroom command becomes motion", items:[
  {say:"Before the clips, here's how a classroom command becomes motion in our current demo.", alt:"Set up the workflow before the clips."},
  {say:"First, you give a command, like 'Point at the whiteboard.'", alt:"Step 1: a spoken command, e.g. point at the whiteboard."},
  {say:"Second, Claude writes JSON: action point, object whiteboard, target null.", alt:"Step 2: Claude's JSON, point, whiteboard, no target."},
  {say:"Third is the human step. I read the JSON, face G1 toward the board, and press P.", alt:"Step 3: you read it, turn G1 to the board, press P."},
  {say:"Fourth, Lucky runs the routine. The script raises the arm, and the walker helps G1 keep its balance.", alt:"Step 4: the script lifts the arm while the walker holds balance."},
  {say:"Fifth, G1 moves in the scene. We watch the arm, record what happened, and note whether it worked.", alt:"Step 5: watch, record, mark success or not."},
  {say:"So the human step matters: JSON describes what to do, but in this demo, we start the script that makes G1 move.", alt:"Key point: JSON says what; in this demo a person starts the motion."},
  {say:"This slide shows the process order only, not measured timings.", alt:"Order only, no timings."},
 ]},
 {name:"Classroom demos", sub:"Slide 7 · Classroom commands: what happened?", items:[
  {say:"Let's look at the difference between understanding a command and executing it.", alt:"Understanding a command and executing it are different."},
  {say:"The first command was 'Walk to the chair.'", alt:"Command one: walk to the chair."},
  {say:"Claude returned move_to, with chair as the object.", alt:"Claude's answer: move_to, chair."},
  {say:"JSON is simply the structured format that holds that answer.", alt:"JSON is just the format holding the answer."},
  {say:"It tells us which action and object Claude selected.", alt:"It records the chosen action and object."},
  {say:"It doesn't contain the robot's joint movements.", alt:"It has no joint movements in it."},
  {cue:"Play the chair clip"},
  {say:"The robot approached the chair, but we also observed contact and stumbling.", alt:"It reached the chair, but bumped it and stumbled."},
  {say:"So approaching it isn't the same as completing the task reliably.", alt:"Getting close isn't the same as a reliable success."},
  {say:"The second command was 'Point at the whiteboard.'", alt:"Command two: point at the whiteboard."},
  {say:"Claude selected point and whiteboard.", alt:"Claude chose point, whiteboard."},
  {say:"For this recording, I triggered the pointing script manually.", alt:"You started the pointing script by hand for this clip."},
  {say:"So, for this clip, I was the middleware.", alt:"You were the middleware here."},
  {cue:"Play the pointing clip"},
  {say:"The robot maintained balance, but the arm didn't fully extend as intended.", alt:"Balanced, but the arm stopped short."},
  {say:"That's a useful observation: the language output matched the request, while the physical execution still needed improvement.", alt:"Language was right; the physical motion still needs work."},
 ]},
 {name:"Goes wrong", sub:"Slide 8 · When motion goes wrong", items:[
  {say:"Now, one more clip.", alt:"One more clip."},
  {say:"We were testing whether a pretrained SONIC whole-body controller could drive G1's movement inside Lucky Engine.", alt:"The test: a pretrained SONIC whole-body controller driving G1 in Lucky Engine."},
  {cue:"Play the failure clip", note:"Pause after it ends."},
  {say:"So... that happened.", alt:"React to the clip."},
  {say:"The robot moved, but it lost balance during the control test.", alt:"It moved, then lost balance."},
  {say:"We haven't confirmed the exact cause, so I wouldn't blame Claude or claim we've already fixed it.", alt:"Cause not confirmed: not blaming Claude, not claiming a fix."},
  {say:"This clip shows why my role matters.", alt:"This is why your role exists."},
  {say:"We need to observe what happened, record the conditions, and investigate the failure.", alt:"Observe, record conditions, investigate."},
  {say:"In simulation, this can be a funny moment.", alt:"In sim it's harmless."},
  {say:"Around students on campus, we wouldn't want this happening.", alt:"Near real students, it wouldn't be acceptable."},
  {say:"That's why we test here first.", alt:"So simulation comes first."},
  {say:"These failures help us decide what needs to improve before supervised testing on a real robot.", alt:"Failures here guide what to fix before real-robot testing."},
 ]},
 {name:"Evaluation", sub:"Slide 9 · Evaluation and handover", items:[
  {say:"For our language evaluation, we prepared ten classroom commands, including three deliberately vague ones, like 'put it over there.'", alt:"Ten test commands, three intentionally vague."},
  {say:"All ten saved responses were valid JSON.", alt:"Every response was valid JSON."},
  {say:"But that only tells us the format worked.", alt:"That only proves the format."},
  {say:"We still need to evaluate whether the action, object, and target were correct.", alt:"Correct action, object and target still need scoring."},
  {say:"'Over there' is a good example.", alt:"Use 'over there' as the example."},
  {say:"Without information about where I'm pointing, the model has to make a prediction from incomplete context.", alt:"Without seeing where you point, the model has to guess."},
  {say:"And even a correct interpretation still needs working robot controls behind it.", alt:"Even a right answer needs working controls."},
  {say:"My takeaway is: we need to record both what the system intended and what the robot actually did.", alt:"Takeaway: log intent and actual behavior."},
  {say:"That leads into Nick's work: breaking tasks into steps we can control and test, such as approach, reach, and grasp.", alt:"Lead into Nick: approach, reach, grasp as testable steps."},
  {say:"Nick, the chair is all yours.", alt:"Hand off to Nick."},
 ]},
];

function S(name,sub,text){ return {name,sub,items:splitText(text)}; }
const NICK1 = [
 S("Title","Nicholas · slide 1","Good afternoon. We are Team 2: Nicholas, Shivam, and Daniel. Our project asks a deceptively simple question: when our humanoid classroom assistant Yotie moves, who is really in control? We are studying how instructions become robot actions, where existing controllers succeed or fail, and what it would take to make those actions more reliable using physics-informed control."),
 S("Team","Nicholas · slide 2","We divided the work into three connected areas. I focused on the classroom tasks and control environment. Shivam investigated Lucky Engine behavior, command interpretation, and controller failures. Daniel worked on motion generation, visualization, and quantitative tracking experiments. Together, we are building a way to observe, measure, and eventually improve G1 behavior."),
 S("Problem","Nicholas · slide 3","A robot has to do more than understand a sentence. It must identify the task, turn that intent into coordinated motion, and respond to balance, contact, and physical constraints. A movement can look convincing in a simulation video while still being unreliable as an actual task. That difference is the core of our research."),
 S("Testbed","Nicholas · slide 4","We chose classroom tasks because they are easy to describe but physically demanding. We want Yotie to approach a chair and stop, point toward a whiteboard, and eventually grasp and move objects. Our immediate approach is to establish a baseline, identify failures, and make repeatable tests before claiming we have a better controller. Shivam will show what the current baseline has taught us."),
];
const DANIEL = [
 S("Motion demo","Daniel · slide 10","My work focused on what happens between a motion reference and a robot actually following it. First, I used motion visualization to inspect the G1's walking and whole-body movement, including gait, posture, and timing. A video is a useful first check, but it does not tell us how closely the joints followed their targets. That is why our next step is to save reference trajectories and compare them against measured joint positions. [Play walking motion video]"),
 S("Elbow","Daniel · slide 11","This slide shows a separate G1 right-elbow simulation experiment. The blue curve is the commanded angle, and the orange curve is the actual response. Ideally they would overlap. Instead, the response lags behind the command, especially during changes in direction. The error graph measures that difference over time. Across 350 samples and 6.98 seconds, we measured a root-mean-square tracking error of 1.20 degrees and a maximum error of 2.37 degrees. Those are measured results from the elbow test, not from the walking video. This gives us a concrete baseline for future control comparisons."),
];
const NICK2 = [
 S("Conclusion","Nicholas · slide 12","To summarize: we can trigger and observe classroom actions, and we can visualize motion references. But chair contact, controller handoff, and repeatable multi-joint tracking still need improvement. Next, we will collect real command, state, and outcome logs, run controlled comparisons, and study how dynamics and feedback constraints affect performance. Our goal is not just a robot that moves, but one whose behavior we can explain, measure, and improve. Thank you — we welcome your questions."),
];
function splitText(text){
  const out=[];
  for(const part of text.split(/(\[[^\]]+\])/)){
    if(!part.trim()) continue;
    if(/^\[.*\]$/.test(part)){ out.push({cue:part.slice(1,-1).replace(/\.$/,"")}); continue; }
    const sents=part.replace(/\s+/g," ").trim().split(/(?<=[.!?]['"’”]?)\s+(?=['"‘“(]?[A-Z0-9])/);
    for(const x of sents) if(x.trim()) out.push({say:x.trim()});
  }
  return out;
}

const BUILTIN = [
 {name:"Shivam", secs:SHIVAM},
 {name:"Nicholas", secs:[...NICK1, ...NICK2]},
 {name:"Daniel", secs:DANIEL},
 {name:"Whole team", secs:[...NICK1, ...SHIVAM, ...DANIEL, ...NICK2]},
];

/* ================= Words & matching ================= */
const NUM={zero:"0",one:"1",two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",won:"1",to_:"2"};
const ALIAS={jason:"json",jayson:"json",jsan:"json",yoti:"yotie",yodie:"yotie",yogi:"yotie",yoty:"yotie",cloud:"claude",clawed:"claude",claud:"claude",gee:"g",shivum:"shivam",shiv:"shivam",nic:"nick",nik:"nick",sonik:"sonic",okay:"ok"};
function tokenize(s){
  return s.toLowerCase().replace(/[’'`]/g,"").replace(/([a-z])(\d)/g,"$1 $2").replace(/(\d)([a-z])/g,"$1 $2")
    .replace(/[^a-z0-9]+/g," ").split(" ").filter(Boolean).map(w=>ALIAS[w]||NUM[w]||w);
}
const STOP=new Set("a an the and or but so if then than that this these those there here is are was were be been being am i im me my we our us you your he she it its they them their to of in on at for from with by as into about over under after before again just also very really can could will would should do did does done have has had not no yes what which who when where why how all any each every some more most other such only own same too now well like get got go one let lets".split(" "));
function lev1(a,b){ if(Math.abs(a.length-b.length)>1) return false; let i=0,j=0,e=0; while(i<a.length&&j<b.length){ if(a[i]===b[j]){i++;j++;continue;} if(++e>1) return false; if(a.length>b.length) i++; else if(b.length>a.length) j++; else {i++;j++;} } return e+(a.length-i)+(b.length-j)<=1; }
function wm(a,b){
  if(a===b) return true;
  const m=Math.min(a.length,b.length); if(m<4) return false;
  let p=0; while(p<m && a[p]===b[p]) p++;
  if(p>=Math.max(4,m-2)) return true;
  return m>=5 && lev1(a,b);
}

let ACTIVE=[], items=[];
function prep(it,si){
  if(it.cue) return {...it,si};
  const spans=it.say.split(/\s+/), words=[];
  spans.forEach((sp,k)=>tokenize(sp).forEach(t=>words.push({t,span:k,content:!STOP.has(t)&&t.length>=3})));
  return {...it,si,spans,words,nContent:words.filter(w=>w.content).length};
}
function build(secs){ ACTIVE=secs; items=[]; secs.forEach((sec,si)=>sec.items.forEach(it=>items.push(prep(it,si)))); }

/* ================= Tracking state ================= */
let cur=0, status=[], al={}, missFrom={}, start=0, committed=[], session=[], strict=0.45;
const heard=()=> session.length?committed.concat(session):committed;

function align(i,from,T){
  const W=items[i].words; let p=0, first=-1, last=-1; const seen=new Set();
  for(let x=Math.max(0,from);x<T.length;x++){
    const tok=T[x];
    for(let j=p;j<Math.min(W.length,p+6);j++){
      if(j>p && !W[j].content) continue;
      if(wm(W[j].t,tok)){ if(first<0) first=x; p=j+1; last=x; break; }
    }
    W.forEach((w,k)=>{ if(w.content && !seen.has(k) && wm(w.t,tok)) seen.add(k); });
  }
  const cov=items[i].nContent? seen.size/items[i].nContent : (p>=W.length?1:0);
  return {p,first,last,cov,seen};
}
function isDone(i,a){
  const n=items[i].words.length, need=strict+0.15;
  if(a.p>=n || (n>3 && a.p>=n-1)) return true;
  if(a.p>=Math.ceil(n*0.8)) return true;
  if(a.cov>=need && a.p>=Math.ceil(n*0.35)) return true;
  if(items[i].nContent>=3 && a.cov>=Math.min(0.9,need+0.1)) return true;
  return false;
}
function nextSay(i){ let j=i; while(j<items.length && items[j].cue) j++; return j; }

function evaluate(){
  const T=heard();
  for(let guard=0; guard<6 && cur<items.length; guard++){
    const it=items[cur];
    if(it.cue){
      const n=nextSay(cur+1); if(n>=items.length) break;
      const a=align(n,start-2,T);
      if(a.p>=2){ for(let k=cur;k<n;k++) status[k]="done"; cur=n; start=Math.max(start,a.first); continue; }
      break;
    }
    const a=align(cur,start-2,T); al[cur]=a;
    if(isDone(cur,a)){ status[cur]="done"; start=a.last>=0?a.last+1:T.length; cur++; continue; }
    let jumped=false;
    for(let k=cur+1, seen=0; k<items.length && seen<2; k++){
      if(items[k].cue) continue; seen++;
      const b=align(k,start-2,T), n=items[k].words.length;
      if(b.p>=Math.min(4,n-1) && b.cov>=0.4 && b.first>=0 && (a.last<0 || b.first>a.first)){
        for(let s=cur;s<k;s++){
          if(items[s].cue){ status[s]="done"; continue; }
          const as=align(s,start-2,T);
          if(isDone(s,as)) status[s]="done"; else { status[s]="missed"; missFrom[s]=start-2; }
        }
        cur=k; start=b.first; jumped=true; break;
      }
    }
    if(!jumped) break;
  }
  for(const k of Object.keys(missFrom)){ const a=align(+k,missFrom[k],T); if(a.cov>=strict+0.15 || isDone(+k,a)){ status[k]="done"; delete missFrom[k]; } }
}

/* ================= Rendering ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function karaoke(i){
  const it=items[i], a=al[i]||{p:0,seen:new Set()};
  const saidSpan=new Set(), curSpan=it.words[a.p]?.span;
  it.words.forEach((w,k)=>{ if(k<a.p || a.seen.has(k)) saidSpan.add(w.span); });
  return it.spans.map((sp,k)=>`<span class="w${saidSpan.has(k)?" said":""}${i===cur&&k===curSpan&&!saidSpan.has(k)?" cur":""}">${esc(sp)}</span>`).join(" ");
}
function cueHTML(b){ return `<div class="cue">▶ ${esc(b.cue)}${b.note?`<small>${esc(b.note)}</small>`:""}</div>`; }
function autoAlt(i){ const w=items[i].words.filter(x=>x.content).map(x=>items[i].spans[x.span].replace(/[^\w'’-]/g,"")); return "Cover: "+[...new Set(w)].slice(0,5).join(" · "); }

function buildLyrics(){
  let html="", last=-1;
  items.forEach((it,i)=>{
    if(it.si!==last){ html+=`<div class="sec" id="S${i}">${esc(ACTIVE[it.si].sub||ACTIVE[it.si].name)}</div>`; last=it.si; }
    html+= it.cue ? `<div class="line" id="L${i}">${cueHTML(it)}</div>` : `<div class="line" id="L${i}"></div>`;
  });
  html+=`<div class="line end" id="Lend">End of script</div>`;
  $("lyr").innerHTML=html;
  items.forEach((it,i)=>{ if(!it.cue) $("L"+i).innerHTML=karaoke(i); });
}
function fade(d){ return d===0?1 : d<0 ? [1,.6,.45,.34,.26][Math.min(4,-d)]||.2 : [1,.5,.34,.24,.18][Math.min(4,d)]||.15; }
function render(){
  const n=items.length;
  if(cur<n){
    const it=items[cur], sec=ACTIVE[it.si];
    const secIdx=items.map((x,i)=>i).filter(i=>items[i].si===it.si && !items[i].cue);
    const pips=secIdx.map(i=>`<span class="pip ${i===cur?"now":status[i]==="done"?"done":status[i]==="missed"?"pmiss":""}"></span>`).join("");
    $("where").innerHTML=`<b>${esc(sec.name)}</b><span class="pips">${pips}</span>`;
  } else {
    const m=Object.keys(missFrom).length;
    $("where").innerHTML=`<b>Done</b>`; $("Lend").textContent=m?"End of script. Lines still listed under “You skipped these” weren't covered.":"End of script. You covered every line.";
  }
  for(let i=0;i<n;i++){
    const el=$("L"+i); if(!el) continue;
    const d=i-cur;
    el.className="line"+(d<0?" past":d>0?" future":"")+(status[i]==="missed"?" missed":"")+(status[i]==="done"&&!al[i]&&!items[i].cue?" donefill":"");
    el.style.opacity=fade(d);
    if(Math.abs(d)<=3 && !items[i].cue) el.innerHTML=karaoke(i);
  }
  items.forEach((it,i)=>{ const s=$("S"+i); if(s) s.style.opacity=fade(i-cur)*.9; });
  const target=cur<n?$("L"+cur):$("Lend"), vp=$("lyrv");
  if(target){ const y=Math.max(0,target.offsetTop - vp.clientHeight*0.3); $("lyr").style.transform=`translateY(${-y}px)`; }
  $("track").innerHTML=ACTIVE.map((s,si)=>{
    const idx=items.map((x,i)=>i).filter(i=>items[i].si===si);
    const isNow=cur<n&&items[cur].si===si, allDone=idx.every(i=>status[i]!=="todo"), miss=idx.some(i=>status[i]==="missed");
    return `<button class="chip ${isNow?"now":allDone?"done":""} ${miss?"hasmiss":""}" data-sec="${si}">${esc(s.name)}</button>`;
  }).join("");
  const nowChip=document.querySelector(".chip.now"); if(nowChip) try{ nowChip.scrollIntoView({block:"nearest",inline:"center"}); }catch(_){}
  const missed=Object.keys(missFrom).map(Number).sort((a,b)=>a-b);
  $("tray").innerHTML = missed.length ? missed.map(i=>`<button class="miss" data-miss="${i}" title="Tap to dismiss"><span class="from">${esc(ACTIVE[items[i].si].name)}</span><span class="say">${esc(items[i].alt||autoAlt(i))}</span></button>`).join("") : `<p class="empty">Nothing skipped so far.</p>`;
  document.body.classList.toggle("notray",trayHidden);
  $("trayOpen").hidden=!trayHidden; $("trayOpen").textContent=missed.length?`Skipped (${missed.length})`:"Skipped";
  const T=heard(); if(T.length) $("heard").innerHTML=`<span>${esc(T.slice(-26).join(" "))}</span>`;
}
window.addEventListener("resize",()=>render());

/* ================= Speech ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let offlinePref=false; try{ offlinePref=localStorage.getItem("lab3offline")==="1"; }catch(_){}
let rec=null, listening=false, t0=null, raf=0, local=false, fails=0, lastEvent=0, lastResult=0, restartT=0, wake=null;
function setStatus(s){ $("status").textContent=s; }
function tick(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ evaluate(); render(); }); }

/* On-device speech (Chrome/Edge that support it): no Wi-Fi needed once downloaded. */
async function prepareLocal(){
  try{
    if(!SR || typeof SR.available!=="function") return false;
    const opts={langs:["en-US"],processLocally:true};
    const st=await SR.available(opts);
    if(st==="available") return true;
    if((st==="downloadable"||st==="downloading") && typeof SR.install==="function"){
      setStatus("Downloading on-device speech… using online for now.");
      SR.install(opts).then(ok=>{ if(ok){ local=true; setStatus("On-device speech ready."); if(listening){ try{ rec.abort(); }catch(_){} } } }).catch(()=>{});
    }
  }catch(_){}
  return false;
}
function makeRec(){
  const r=new SR(); r.continuous=true; r.interimResults=true; r.lang="en-US"; r.maxAlternatives=1;
  if(local){ try{ r.processLocally=true; }catch(_){} }
  const alive=()=>{ lastEvent=Date.now(); };
  r.onstart=alive; r.onaudiostart=alive; r.onspeechstart=alive;
  r.onresult=e=>{
    alive(); lastResult=Date.now(); fails=0; updMic();
    const all=[]; for(let i=0;i<e.results.length;i++) all.push(...tokenize(e.results[i][0].transcript));
    session=all; tick();
  };
  r.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      if(local && e.error==="service-not-allowed"){ local=false; return; }   // fall back to online quietly
      listening=false; updMic(); setStatus("Microphone blocked. iPhone: Settings › Safari › Microphone › Allow. Then tap Start."); return;
    }
    if(e.error==="audio-capture"){ setStatus("No microphone found."); }
    if(e.error==="language-not-supported" && local){ local=false; }
    if(e.error!=="no-speech" && e.error!=="aborted") fails++;
  };
  r.onend=()=>{
    committed=committed.concat(session); session=[];
    if(!listening || r!==rec) return;
    clearTimeout(restartT);
    restartT=setTimeout(relisten, fails? Math.min(1500,120*2**Math.min(fails,4)) : 40);
    updMic();
  };
  return r;
}
function relisten(){ if(!listening) return; rec=makeRec(); try{ rec.start(); lastEvent=Date.now(); }catch(_){ fails++; clearTimeout(restartT); restartT=setTimeout(relisten,400); } }
async function startMic(){
  if(!SR){ setStatus("Voice tracking isn't available in this browser. On iPhone use Safari; Next still works."); return; }
  listening=true; setStatus(""); if(!t0) t0=Date.now(); updMic();
  local = offlinePref ? await Promise.race([prepareLocal(), new Promise(r=>setTimeout(()=>r(false),1500))]) : false;
  relisten();
  try{ wake=await navigator.wakeLock?.request("screen"); }catch(_){}
}
function stopMic(){ listening=false; clearTimeout(restartT); try{ rec&&rec.stop(); }catch(_){} updMic(); }
function updMic(){
  const weak=listening && fails>=3 && Date.now()-lastResult>6000;
  $("mic").classList.toggle("on",listening); $("mic").classList.toggle("weak",weak);
  $("micLabel").textContent=!listening?"Start listening": weak?"Reconnecting…" : local?"Listening · offline":"Listening";
}
/* Watchdog: some browsers silently stop listening without telling the page. */
setInterval(()=>{
  if(!listening) return;
  if(Date.now()-lastEvent>9000){ lastEvent=Date.now(); try{ rec.abort(); }catch(_){ relisten(); } }
  updMic();
},1500);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && listening){ try{ rec.abort(); }catch(_){ relisten(); } navigator.wakeLock?.request("screen").then(w=>wake=w).catch(()=>{}); } });
$("mic").onclick=()=> listening?stopMic():startMic();
setInterval(()=>{ if(!t0) return; const s=Math.floor((Date.now()-t0)/1000); $("clock").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; },500);

/* ================= Controls ================= */
function manualNext(){
  if(cur>=items.length) return;
  if(!items[cur].cue){ const a=al[cur]; if(a && a.p>0) status[cur]="done"; else { status[cur]="missed"; missFrom[cur]=heard().length; } } else status[cur]="done";
  cur++; start=heard().length; render();
}
function back(){ if(cur===0) return; cur--; status[cur]="todo"; delete missFrom[cur]; delete al[cur]; start=heard().length; render(); }
function jumpSection(si){ const i=items.findIndex(b=>b.si===si); for(let k=i;k<items.length;k++){ status[k]="todo"; delete missFrom[k]; } al={}; cur=i; start=heard().length; render(); }
function restart(){ cur=0; status=items.map(()=>"todo"); al={}; missFrom={}; committed=[]; session=[]; start=0; t0=listening?Date.now():null; $("clock").textContent="0:00"; $("heard").innerHTML="<span>Transcript appears here once listening starts.</span>"; buildLyrics(); render(); }
function size(d){ const v=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size"))+d; document.documentElement.style.setProperty("--size",Math.max(22,Math.min(90,v))+"px"); save(); render(); }

$("track").onclick=e=>{ const c=e.target.closest("[data-sec]"); if(c) jumpSection(+c.dataset.sec); };
$("tray").onclick=e=>{ const m=e.target.closest("[data-miss]"); if(m){ const i=+m.dataset.miss; status[i]="done"; delete missFrom[i]; render(); } };
document.addEventListener("keydown",e=>{
  if($("setup").open || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key===" "||e.key==="ArrowRight"||e.key==="PageDown"){ e.preventDefault(); manualNext(); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); back(); }
  else if(e.key==="m"||e.key==="M"){ listening?stopMic():startMic(); }
  else if(e.key==="+"||e.key==="="){ size(4); }
  else if(e.key==="-"||e.key==="_"){ size(-4); }
  else if(e.key==="r"||e.key==="R"){ restart(); }
});
$("nextBtn").onclick=manualNext; $("backBtn").onclick=back;
let trayHidden=false; try{ trayHidden=localStorage.getItem("lab3tray")==="0"; }catch(_){}
function setTray(hide){ trayHidden=hide; try{ localStorage.setItem("lab3tray",hide?"0":"1"); }catch(_){} render(); }
$("trayClose").onclick=()=>setTray(true); $("trayOpen").onclick=()=>setTray(false);

/* ================= Settings & uploads ================= */
function save(){ try{ localStorage.setItem("lab3prompter",JSON.stringify({strict,size:getComputedStyle(document.documentElement).getPropertyValue("--size").trim()})); }catch(_){} }
try{ const p=JSON.parse(localStorage.getItem("lab3prompter")||"{}"); if(p.strict) strict=+p.strict; if(p.size) document.documentElement.style.setProperty("--size",p.size); }catch(_){}
$("inOffline").checked=offlinePref; $("inOffline").onchange=e=>{ offlinePref=e.target.checked; try{ localStorage.setItem("lab3offline",offlinePref?"1":"0"); }catch(_){} };
$("setupBtn").onclick=()=>{ $("inSize").value=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--size")); $("inStrict").value=strict; $("setup").showModal(); };
$("closeSetup").onclick=()=>{ strict=+$("inStrict").value; save(); $("setup").close(); render(); };
$("inSize").oninput=e=>{ document.documentElement.style.setProperty("--size",e.target.value+"px"); save(); render(); };
$("restartBtn").onclick=()=>{ restart(); $("setup").close(); };

function parseText(raw){
  const lines=raw.replace(/\r/g,"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const secs=[]; let sec=null;
  const isHead=l=> l.length<=70 && (/^(#+|\d+[.)])\s+\S/.test(l) || /^slide\s*\d+/i.test(l) || (!/[.?!:;,"”’)\]]$/.test(l) && l.split(/\s+/).length<=8));
  for(const l of lines){
    if(isHead(l)){ sec={name:l.replace(/^(#+|\d+[.)])\s*/,"").replace(/[*_]/g,"").slice(0,30),sub:"",items:[]}; secs.push(sec); continue; }
    if(!sec){ sec={name:"Start",sub:"",items:[]}; secs.push(sec); }
    sec.items.push(...splitText(l.replace(/[*]/g,"")));
  }
  return secs.filter(x=>x.items.some(b=>!b.cue));
}
function joinPdfLines(lines){
  const out=[];
  for(const raw of lines){ const l=raw.trim(); if(!l){ out.push(""); continue; }
    const prev=out[out.length-1];
    if(prev && !/[.?!:"”’\]]$/.test(prev) && /^[a-z(,'‘]/.test(l)) out[out.length-1]=prev+" "+l; else out.push(l); }
  return out.join("\n");
}
function loadLib(src){ return new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=()=>rej(new Error("Couldn't load the file reader. Check your connection.")); document.head.appendChild(el); }); }
async function fileToText(f){
  const n=f.name.toLowerCase();
  if(n.endsWith(".pdf")){
    if(!window.pdfjsLib){ await loadLib("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise; const lines=[];
    for(let i=1;i<=pdf.numPages;i++){
      const c=await (await pdf.getPage(i)).getTextContent(); let line="", lastY=null;
      for(const it of c.items){ const y=it.transform[5]; if(lastY!==null && Math.abs(y-lastY)>2){ lines.push(line); line=""; } line+=it.str; lastY=y; if(it.hasEOL){ lines.push(line); line=""; lastY=null; } }
      lines.push(line); lines.push("");
    }
    return joinPdfLines(lines);
  }
  if(n.endsWith(".docx")){ if(!window.mammoth) await loadLib("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"); return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value; }
  if(n.endsWith(".doc")) throw new Error("Old .doc files can't be read. Save it as .docx or PDF, or paste the text.");
  return await f.text();
}
let saved=[]; try{ saved=JSON.parse(localStorage.getItem("lab3scripts2")||"[]"); }catch(_){}
function persistScripts(){ try{ localStorage.setItem("lab3scripts2",JSON.stringify(saved)); }catch(_){} }
function fillSpeakers(sel){
  $("speaker").innerHTML=BUILTIN.map((x,i)=>`<option value="b${i}">${esc(x.name)}</option>`).join("")+(saved.length?`<optgroup label="Uploaded">`+saved.map((x,i)=>`<option value="u${i}">${esc(x.name)} (uploaded)</option>`).join("")+`</optgroup>`:"");
  $("speaker").value=sel;
}
function useScript(key){ const i=+key.slice(1); build(key[0]==="b"?BUILTIN[i].secs:saved[i].secs); restart(); try{ localStorage.setItem("lab3speaker",key); }catch(_){} }
$("speaker").onchange=e=>useScript(e.target.value);
function renderSaved(){ $("savedRow").innerHTML=saved.map((x,i)=>`<button data-del="${i}">Remove ${esc(x.name)}</button>`).join(""); }
$("savedRow").onclick=e=>{ const b=e.target.closest("[data-del]"); if(!b) return; const i=+b.dataset.del, curKey=$("speaker").value; saved.splice(i,1); persistScripts(); renderSaved();
  if(curKey==="u"+i){ fillSpeakers("b0"); useScript("b0"); } else if(curKey[0]==="u" && +curKey.slice(1)>i) fillSpeakers("u"+(+curKey.slice(1)-1)); else fillSpeakers(curKey); };
$("loadBtn").onclick=async()=>{
  const name=$("inName").value.trim()||"Teammate", f=$("inFile").files[0], pasted=$("inPaste").value.trim();
  if(!f && !pasted){ $("loadMsg").textContent="Choose a file or paste the script first."; return; }
  $("loadMsg").textContent="Reading…";
  try{
    const secs=parseText(f? await fileToText(f) : pasted);
    const n=secs.reduce((a,x)=>a+x.items.filter(b=>!b.cue).length,0);
    if(!n){ $("loadMsg").textContent="No readable text found. Scanned PDFs won't work; try the .docx or paste it."; return; }
    const at=saved.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
    if(at>=0) saved[at]={name,secs}; else saved.push({name,secs});
    persistScripts(); const idx=at>=0?at:saved.length-1;
    fillSpeakers("u"+idx); useScript("u"+idx); renderSaved();
    $("loadMsg").textContent=`Loaded ${n} sentences in ${secs.length} sections.`; $("inFile").value=""; $("inPaste").value="";
  }catch(err){ $("loadMsg").textContent=err.message||"Couldn't read that file."; }
};

let startKey="b0"; try{ startKey=localStorage.getItem("lab3speaker")||"b0"; }catch(_){}
if(!((startKey[0]==="b"&&BUILTIN[+startKey.slice(1)])||(startKey[0]==="u"&&saved[+startKey.slice(1)]))) startKey="b0";
fillSpeakers(startKey); renderSaved(); useScript(startKey);
</script>
