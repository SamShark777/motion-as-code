# Daily psychology Shorts: builds tomorrow's batch from the scripts Claude wrote ahead
# (branch `shorts`, tracker Status "Scripted"), hosts them on the `media` branch and schedules
# them on Buffer (YouTube Shorts, Instagram Reels, TikTok). Opens an issue with previews so
# Shivam can veto (delete in Buffer) before they go out.
#
# Secrets:   BUFFER_API_KEY      (Buffer → Settings → API; without it the run is a dry run)
#            VOICE_REF_OPUS_B64  (Shivam's voice reference, base64 Opus; without it: Kokoro voice)
# Variables: SHORTS_PER_DAY (default 3), SLOTS (default 09:00,14:00,19:00, America/Los_Angeles)
name: Daily Shorts

on:
  schedule:
    - cron: "17 16 * * *"   # 09:17 PDT / 08:17 PST — ~40 min of building, then scheduled for tomorrow
  workflow_dispatch:
    inputs:
      only_slugs:
        description: "Test: build only these slugs (comma-separated). Always a dry run."
        required: false
        default: ""
      schedule_at:
        description: "With only_slugs: post them for real at these PT times, comma-separated (e.g. 2026-10-14T17:00,2026-10-14T20:00)"
        required: false
        default: ""
      dry_run:
        description: "Build and host, but don't schedule on Buffer"
        type: boolean
        default: false
      ig_catchup:
        description: "Run the Instagram catch-up now (adds missed Shorts to Instagram; see scripts/ig_catchup.py)"
        type: boolean
        default: false
      buffer_check:
        description: "Only check the Buffer connection (lists channels + post schema), build nothing"
        type: boolean
        default: false
      buffer_cancel:
        description: "Only cancel: delete the still-scheduled Buffer posts of these slugs (comma-separated), build nothing"
        required: false
        default: ""
      music_fetch:
        description: "Only (re)build the real-music library (Kevin MacLeod, CC BY) on the music branch"
        type: boolean
        default: false
      lottie_fetch:
        description: "Only fetch free LottieFiles animations for these comma-separated keywords (pushed to the assets-lottie branch)"
        required: false
        default: ""
      chatterbox_test:
        description: "Only make Chatterbox voice samples from these Kokoro reference voices, comma-separated (MP3s on the voice-tests branch)"
        required: false
        default: ""
      eleven_test:
        description: "Only make ElevenLabs voice samples: voice_id:label,... (MP3s on the voice-tests branch)"
        required: false
        default: ""
      voice_test:
        description: "Only make a voice comparison (A/B MP3s on the voice-tests branch) from this slug's first lines"
        required: false
        default: ""

concurrency:
  group: daily-shorts-${{ (inputs.buffer_check || inputs.voice_test != '' || inputs.lottie_fetch != '' || inputs.music_fetch || inputs.buffer_cancel != '' || inputs.eleven_test != '' || inputs.chatterbox_test != '') && 'check' || 'run' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  SHORTS_PER_DAY: ${{ vars.SHORTS_PER_DAY || '3' }}
  SLOTS: ${{ vars.SLOTS || '09:00,14:00,19:00' }}
  ONLY_SLUGS: ${{ inputs.only_slugs }}
  SCHEDULE_AT: ${{ inputs.schedule_at }}

jobs:
  ig-catchup:
    if: inputs.ig_catchup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 scripts/ig_catchup.py > out.txt 2>&1; code=$?
          while IFS= read -r line; do echo "::notice::${line:0:3900}"; done < out.txt
          git config user.name shorts-bot; git config user.email shorts-bot@users.noreply.github.com
          git add shorts/Psychology_Shorts_Tracker.xlsx shorts/*/post.json
          git diff --cached --quiet || { git commit -qm "ci: instagram catch-up $(date -u +%F)"; for i in 1 2 3; do git pull -q --rebase origin shorts && git push -q origin shorts && break; sleep 5; done; }
          exit $code

  buffer-check:
    if: inputs.buffer_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set +e
          { python3 scripts/buffer.py stats | grep -E '^(STAT|STATS_FAILED)'; python3 scripts/buffer.py channels | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d))"; python3 scripts/buffer.py posts | python3 -c "import json,sys; P=json.load(sys.stdin); L=[p['id']+'|'+p['status']+'|'+str(p.get('dueAt'))[:16]+'|'+str(p.get('externalLink') or '') for p in P]; [print(' '.join(L[i:i+30])) for i in range(0,len(L),30)]"; } > out.txt 2>&1
          code=$?
          # annotations are readable through the API (the raw log isn't, from Claude's side)
          while IFS= read -r line; do echo "::notice::${line:0:3900}"; done < out.txt
          exit $code

  buffer-cancel:
    if: ${{ inputs.buffer_cancel != '' && inputs.buffer_cancel != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - run: pip install -q openpyxl
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SLUGS: ${{ inputs.buffer_cancel }}
        run: |
          set +e
          python3 scripts/buffer.py cancel "$SLUGS" > out.txt 2>&1
          code=$?
          while IFS= read -r line; do echo "::notice::${line:0:3900}"; done < out.txt
          exit $code

  music-fetch:
    if: inputs.music_fetch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: python3 analysis/music_lib.py fetch out/music | tee out.txt; while IFS= read -r l; do echo "::notice::$l"; done < <(grep -E "^(calm|uplifting|playful|mystery|tense|lofi|library|[0-9]+ pieces)" out.txt)
      - name: Publish to music branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out/music && git init -q && git checkout -q -b music && git add .
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "music library"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" music

  lottie-fetch:
    if: ${{ inputs.lottie_fetch != '' && inputs.lottie_fetch != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - run: python3 scripts/lottie_fetch.py "${{ inputs.lottie_fetch }}" 6
      - name: Publish to assets-lottie branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out/lottie && git init -q && git checkout -q -b assets-lottie && git add .
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "lottie: ${{ inputs.lottie_fetch }}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" assets-lottie

  voice-test:
    if: ${{ inputs.voice_test != '' && inputs.voice_test != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NO_VOICE_DESIGN: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - name: Music library (real tracks; falls back to generated beds if missing)
        uses: actions/checkout@v4
        continue-on-error: true
        with: { ref: music, path: music }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: voice-models-v1
      - name: Python packages
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q omnivoice kokoro-onnx soundfile numpy
      - name: Voice reference
        env:
          VOICE: ${{ secrets.VOICE_REF_OPUS_B64 }}
          VOICE_V2_A: ${{ secrets.VOICE_REF_V2_A }}
          VOICE_V2_B: ${{ secrets.VOICE_REF_V2_B }}
        run: |
          # v2 (20 s recording, two secrets because of GitHub's 48 KB limit) wins when present
          if [ -n "$VOICE_V2_A" ] && [ -n "$VOICE_V2_B" ]; then
            printf '%s%s' "$VOICE_V2_A" "$VOICE_V2_B" | base64 -d > /tmp/ref.opus
            cp shorts/voice/reference_v2.txt shorts/voice/reference.txt
            echo "voice: v2"
          elif [ -n "$VOICE" ]; then
            printf '%s' "$VOICE" | base64 -d > /tmp/ref.opus
            echo "voice: v1"
          else
            echo "::warning::voice secrets not set — this video uses the fallback (Kokoro) voice"
          fi
          if [ -f /tmp/ref.opus ]; then
            ffmpeg -v error -y -i /tmp/ref.opus -ac 1 -ar 24000 shorts/voice/reference.wav
            echo "voice reference: $(ffprobe -v error -show_entries format=duration -of csv=p=0 shorts/voice/reference.wav)s"
          fi
      - name: Generate A/B
        run: python3 scripts/voice_test.py "${{ inputs.voice_test }}"
      - name: Publish to voice-tests branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(mktemp -d); cp out/voice_A.mp3 out/voice_B.mp3 "$D"; cd "$D"
          git init -q && git checkout -q -b voice-tests && git add . 
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "voice test ${{ inputs.voice_test }}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" voice-tests
          for f in voice_A voice_B; do echo "::notice::https://raw.githubusercontent.com/${{ github.repository }}/voice-tests/$f.mp3"; done

  chatterbox-test:
    if: ${{ inputs.chatterbox_test != '' && inputs.chatterbox_test != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
          key: chatterbox-v1
      - name: Install (CPU torch)
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts kokoro-onnx soundfile numpy
      - name: Generate samples
        run: |
          set +e
          python3 scripts/chatterbox_test.py "${{ inputs.chatterbox_test }}" > res.txt 2>&1; code=$?
          tail -c 3000 res.txt | grep -v -E "^\s*$|it/s|s/it" | tail -12 | while IFS= read -r line; do echo "::notice::${line:0:600}"; done
          exit $code
      - name: Publish to voice-tests branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(mktemp -d); cp out/chatterbox/*.mp3 "$D"; cd "$D"
          git init -q && git checkout -q -b voice-tests && git add .
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "chatterbox samples"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" voice-tests

  eleven-test:
    if: ${{ inputs.eleven_test != '' && inputs.eleven_test != null }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - name: Generate samples
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          python3 scripts/eleven_test.py "${{ inputs.eleven_test }}" > res.txt 2>&1; code=$?
          while IFS= read -r line; do echo "::notice::${line:0:900}"; done < res.txt
          exit $code
      - name: Publish to voice-tests branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$(mktemp -d); cp out/eleven/*.mp3 "$D"; cd "$D"
          git init -q && git checkout -q -b voice-tests && git add .
          git -c user.name=shorts-bot -c user.email=shorts-bot@users.noreply.github.com commit -qm "elevenlabs samples"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" voice-tests

  plan:
    if: ${{ !inputs.buffer_check && !inputs.voice_test && !inputs.lottie_fetch && !inputs.music_fetch && !inputs.buffer_cancel && !inputs.eleven_test && !inputs.chatterbox_test && !inputs.ig_catchup }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl
      - id: plan
        run: python3 scripts/ci_shorts.py plan
      - uses: actions/upload-artifact@v4
        with: { name: plan, path: plan.json }

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      NO_VOICE_DESIGN: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/kokoro
            ~/cbenv
          key: voice-models-v2-cb
      - name: Python packages
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q omnivoice kokoro-onnx soundfile pillow numpy openpyxl
      - name: Chatterbox (own venv, Ted narrator)
        run: |
          [ -x ~/cbenv/bin/python ] || python -m venv ~/cbenv
          ~/cbenv/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          ~/cbenv/bin/pip install -q chatterbox-tts
          echo "CHATTERBOX_PY=$HOME/cbenv/bin/python" >> "$GITHUB_ENV"
      - name: Voice reference
        env:
          VOICE: ${{ secrets.VOICE_REF_OPUS_B64 }}
          VOICE_V2_A: ${{ secrets.VOICE_REF_V2_A }}
          VOICE_V2_B: ${{ secrets.VOICE_REF_V2_B }}
        run: |
          # v2 (20 s recording, two secrets because of GitHub's 48 KB limit) wins when present
          if [ -n "$VOICE_V2_A" ] && [ -n "$VOICE_V2_B" ]; then
            printf '%s%s' "$VOICE_V2_A" "$VOICE_V2_B" | base64 -d > /tmp/ref.opus
            cp shorts/voice/reference_v2.txt shorts/voice/reference.txt
            echo "voice: v2"
          elif [ -n "$VOICE" ]; then
            printf '%s' "$VOICE" | base64 -d > /tmp/ref.opus
            echo "voice: v1"
          else
            echo "::warning::voice secrets not set — this video uses the fallback (Kokoro) voice"
          fi
          if [ -f /tmp/ref.opus ]; then
            ffmpeg -v error -y -i /tmp/ref.opus -ac 1 -ar 24000 shorts/voice/reference.wav
            echo "voice reference: $(ffprobe -v error -show_entries format=duration -of csv=p=0 shorts/voice/reference.wav)s"
          fi
      - name: App dependencies
        run: cd app && bun install
      - name: Pick illustrations (Ted type 1)
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('shorts/${{ matrix.slug }}/script.json')).get('format')=='ted1' else 1)"; then
            python3 scripts/lottie_pick.py "${{ matrix.slug }}"
            mkdir -p dist/${{ matrix.slug }} && cp shorts/${{ matrix.slug }}/lottie/CREDITS.json dist/${{ matrix.slug }}/ || true
          fi
      - name: Build ${{ matrix.slug }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          COVER_DATE: ${{ matrix.date }}
          COVER_SLOT: ${{ matrix.slot }}
        run: |
          mkdir -p out
          set -o pipefail
          bash scripts/build_short.sh "${{ matrix.slug }}" 2>&1 | tee out/build.log | grep -v -E '^\s*[0-9]+/[0-9]+ frames' || true
      - name: Check
        if: always()
        run: python3 scripts/ci_shorts.py check "${{ matrix.slug }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-${{ matrix.slug }}
          path: dist/${{ matrix.slug }}
          retention-days: 7

  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: shorts }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q openpyxl
      - uses: actions/download-artifact@v4
        with: { name: plan, path: . }
      - uses: actions/download-artifact@v4
        with: { pattern: short-*, path: dist }
      - name: Flatten artifacts
        run: for d in dist/short-*; do [ -d "$d" ] && mv "$d" "dist/${d#dist/short-}"; done; ls -R dist | head -50
      - name: Host, schedule, record
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scripts/ci_shorts.py publish dist
      - name: Commit tracker
        run: |
          git config user.name shorts-bot
          git config user.email shorts-bot@users.noreply.github.com
          git add shorts/Psychology_Shorts_Tracker.xlsx
          git add shorts/*/post.json 2>/dev/null || true
          git add shorts/long/*/post.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -qm "ci: scheduled $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin shorts && git push -q origin shorts && exit 0; sleep 5; done
          exit 1
      - name: Issue for Shivam
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f issue.md ] || echo "The run failed before scheduling — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > issue.md
          echo "" >> issue.md; echo "[Run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> issue.md
          gh issue create -R "${{ github.repository }}" --title "Shorts for $(TZ=America/Los_Angeles date -d tomorrow +'%a %b %-d')${ONLY_SLUGS:+ (test)}" --body-file issue.md
